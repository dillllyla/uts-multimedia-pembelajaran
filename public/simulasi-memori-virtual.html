<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Simulasi Memori Virtual</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f0ff;--card:#fff;--tx:#2a1748;--mut:#6f5a8c;--bd:#e0cffa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150e22;--card:#1f1631;--tx:#efe6fb;--mut:#b3a0cf;--bd:#3c2b59}}
:root[data-theme="dark"]{--bg:#150e22;--card:#1f1631;--tx:#efe6fb;--mut:#b3a0cf;--bd:#3c2b59}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 10px}
.stage{border-radius:16px;overflow:hidden;border:1px solid var(--bd);background:#f1e7ff}
svg{display:block;width:100%;height:auto}
.cap{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600;min-height:3.4em}
.ctl{display:flex;gap:10px;align-items:center}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;background:#7c2ce8;color:#fff;cursor:pointer}
input[type=range]{flex:1}
.tm{font-size:.85rem;color:var(--mut);min-width:70px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<h1>🎬 Simulasi Memori Virtual: RAM Penuh, Harddisk Membantu</h1>
<div class="stage">
<svg viewBox="0 0 800 450" font-family="system-ui,sans-serif" text-anchor="middle">
<rect width="800" height="450" fill="#f1e7ff"/>
<!-- student + apps -->
<text x="60" y="34" font-size="26">🧑‍💻</text><text x="60" y="52" font-size="11" font-weight="700" fill="#4b2a85">Bayu</text>
<g id="apps"></g>
<!-- OS -->
<rect x="112" y="60" width="90" height="360" rx="12" fill="#7c2ce8" fill-opacity=".12" stroke="#7c2ce8" stroke-dasharray="6 4"/>
<text x="157" y="225" font-size="13" font-weight="700" fill="#5b1fb8">OS</text>
<text x="157" y="241" font-size="11" fill="#5b1fb8">Memory</text>
<text x="157" y="255" font-size="11" fill="#5b1fb8">Manager</text>
<!-- RAM + disk -->
<text id="ramT" x="408" y="82" font-size="13" font-weight="700" fill="#4b2a85"></text>
<g id="ramS"></g>
<text x="464" y="300" font-size="13" font-weight="700" fill="#4b2a85">💽 Harddisk (ruang swap, sangat luas)</text>
<g id="disS"></g>
<text id="fl" x="464" y="210" font-size="15" font-weight="800"></text>
<g id="pages"></g>
<!-- virtual view -->
<rect x="608" y="40" width="184" height="200" rx="12" fill="#fff" stroke="#7c2ce8" stroke-width="2"/>
<text x="700" y="62" font-size="12" font-weight="700" fill="#5b1fb8">🔮 Tampilan Virtual</text>
<text x="700" y="77" font-size="10" fill="#6f5a8c">(yang dilihat aplikasi)</text>
<g id="virt"></g>
</svg>
</div>
<div class="cap" id="cap"></div>
<div class="ctl">
  <button id="pp">⏸</button>
  <button id="rs">↺</button>
  <button id="muteBtn" title="Bisukan / Nyalakan Suara">🔊</button>
  <input type="range" id="sc" min="0" max="6165" value="0">
  <span class="tm" id="tm"></span>
</div>
<audio id="aud" src="/suara/video3.mp4" preload="auto"></audio>
</div>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const aud=$('aud');
let T=61.65;
aud.onloadedmetadata=()=>{if(aud.duration&&!isNaN(aud.duration)){T=aud.duration;$('sc').max=Math.round(T*100)}};

const el=(tag,a,p,txt)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e};
const pos={};for(let s=0;s<6;s++)pos['r'+s]=[240+s*56,100];for(let d=0;d<8;d++)pos['d'+d]=[240+d*56,320];
const APP=[{k:'W',n:'Word',ic:'📝',c:'#2b7fff',o:7},{k:'B',n:'Browser',ic:'🌐',c:'#ff8a3d',o:12},{k:'S',n:'Spotify',ic:'🎵',c:'#1db954',o:14.5},{k:'P',n:'Photoshop',ic:'🎨',c:'#a23cf0',o:20}];
APP.forEach((a,i)=>{pos['o'+a.k]=[60,100+i*80]});
const PG=[
{a:0,l:'W1',kf:[[7,'oW'],[8,'r0'],[21,'r0'],[22.5,'d0'],[38.5,'d0'],[40.2,'r2']]},
{a:0,l:'W2',kf:[[7.3,'oW'],[8.3,'r1'],[21,'r1'],[22.5,'d1'],[38.5,'d1'],[40.2,'r3']]},
{a:1,l:'B1',kf:[[12,'oB'],[13.2,'r2'],[37.5,'r2'],[39,'d2']]},
{a:1,l:'B2',kf:[[12.3,'oB'],[13.5,'r3'],[37.5,'r3'],[39,'d3']]},
{a:2,l:'S1',kf:[[14.5,'oS'],[15.5,'r4']]},
{a:2,l:'S2',kf:[[14.8,'oS'],[15.8,'r5']]},
{a:3,l:'P1',kf:[[22.5,'oP'],[24,'r0']]},
{a:3,l:'P2',kf:[[22.8,'oP'],[24.3,'r1']]}];
const S=[[0,'RAM Bayu terbatas, hanya 6 slot. Padahal ia ingin membuka banyak aplikasi sekaligus.'],
[7,'Bayu membuka Word. OS menaruh halaman memorinya di RAM.'],
[12,'Lalu Bayu membuka browser, dan setelah itu Spotify. RAM mulai terisi.'],
[17.5,'RAM sekarang penuh (6/6)!'],
[20,'Bayu membuka Photoshop. OS memindahkan halaman Word yang lama tak dipakai ke harddisk (swap out) demi ruang kosong.'],
[27,'Setiap aplikasi tetap merasa punya memori lega dan rapi. Kerumitan hardware disembunyikan OS.'],
[37.5,'Bayu kembali ke Word. OS memindahkan halaman Browser ke harddisk, lalu memanggil halaman Word kembali ke RAM (swap in).'],
[45,'Semua aplikasi tetap berjalan tanpa tahu bahwa RAM fisik sebenarnya penuh.'],
[51.5,'Itulah Virtualization: harddisk dijadikan cadangan RAM lewat memori virtual, dan pengguna tak perlu tahu rumitnya.']];
for(let s=0;s<6;s++)el('rect',{x:pos['r'+s][0],y:100,width:48,height:48,rx:6,fill:'#fff',stroke:'#b79be0','stroke-dasharray':'4 3'},$('ramS'));
for(let d=0;d<8;d++)el('rect',{x:pos['d'+d][0],y:320,width:48,height:48,rx:6,fill:'#fff',stroke:'#b79be0','stroke-dasharray':'4 3'},$('disS'));
const AG=[],VG=[],PE=[];
APP.forEach((a,i)=>{const g=el('g',{},$('apps'));el('rect',{x:36,y:76+i*80,width:48,height:48,rx:10,fill:a.c},g);el('text',{x:60,y:108+i*80,'font-size':24},g,a.ic);el('text',{x:60,y:138+i*80,'font-size':10,'font-weight':700,fill:'#4b2a85'},g,a.n);AG.push(g);
 const v=el('g',{},$('virt'));el('rect',{x:618,y:90+i*36,width:164,height:28,rx:6,fill:a.c},v);el('text',{x:700,y:108+i*36,'font-size':11,fill:'#fff','font-weight':700},v,a.n+': memori lega ✓');VG.push(v)});
PG.forEach(p=>{const g=el('g',{},$('pages'));el('rect',{x:0,y:0,width:48,height:48,rx:6,fill:APP[p.a].c,stroke:'#fff','stroke-width':2},g);el('text',{x:24,y:29,'font-size':14,fill:'#fff','font-weight':800},g,p.l);PE.push(g)});
const sm=x=>x*x*(3-2*x);
function render(t){
 let si=0;S.forEach((s,i)=>{if(t>=s[0])si=i});$('cap').textContent=S[si][1];
 APP.forEach((a,i)=>{AG[i].setAttribute('opacity',t>=a.o?1:.3);VG[i].setAttribute('opacity',t>=a.o?1:0)});
 let inRam=0,out=false,inn=false;
 PG.forEach((p,i)=>{const kf=p.kf,g=PE[i];
  if(t<kf[0][0]){g.setAttribute('opacity',0);return}
  g.setAttribute('opacity',1);let x,y,j=0;
  while(j<kf.length-1&&t>=kf[j+1][0])j++;
  const A=pos[kf[j][1]];
  if(j===kf.length-1){x=A[0];y=A[1]}
  else{const B=pos[kf[j+1][1]],q=sm((t-kf[j][0])/(kf[j+1][0]-kf[j][0]));x=A[0]+(B[0]-A[0])*q;y=A[1]+(B[1]-A[1])*q;
   const f=kf[j][1][0],to=kf[j+1][1][0];if(f==='r'&&to==='d')out=true;if(f==='d'&&to==='r')inn=true}
  g.setAttribute('transform',`translate(${x},${y})`);
  if(y>=95&&y<=110&&x>=235)inRam++;
 });
 $('ramT').textContent=`RAM (fisik, terbatas): terisi ${inRam}/6`;
 const f=$('fl');f.textContent=out?'⬇ SWAP OUT ke harddisk':inn?'⬆ SWAP IN ke RAM':'';f.setAttribute('fill',out?'#e0561a':'#12a150');
 $('sc').value=Math.round(t*100);$('tm').textContent=t.toFixed(0)+' / '+T.toFixed(0)+' dtk';
}
let t=0,run=true,last=performance.now();
function frame(now){
 const dt=(now-last)/1000;last=now;
 if(run){
  if(!aud.paused&&aud.currentTime>0){t=aud.currentTime}else{t+=dt}
  if(t>=T){t=T;run=false;$('pp').textContent='▶';aud.pause()}
 }
 render(t);
 requestAnimationFrame(frame);
}
$('pp').onclick=()=>{
 if(t>=T){t=0;try{aud.currentTime=0}catch(e){}}
 run=!run;$('pp').textContent=run?'⏸':'▶';
 if(run){aud.play().catch(()=>{})}else{aud.pause()}
};
$('rs').onclick=()=>{t=0;try{aud.currentTime=0}catch(e){};run=true;$('pp').textContent='⏸';aud.play().catch(()=>{})};
$('muteBtn').onclick=()=>{aud.muted=!aud.muted;$('muteBtn').textContent=aud.muted?'🔇':'🔊'};
$('sc').oninput=e=>{t=e.target.value/100;try{aud.currentTime=Math.min(t,aud.duration||t)}catch(e){};render(t)};
document.addEventListener('click',()=>{if(run&&aud.paused){try{aud.currentTime=t}catch(e){};aud.play().catch(()=>{})}},{once:true});
aud.play().catch(()=>{});
requestAnimationFrame(frame);
</script>
</body>
</html>
