<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Simulasi Berbagi Printer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8e8;--card:#fff;--tx:#3a2412;--mut:#7a6650;--bd:#f5dcae}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a140c;--card:#261d12;--tx:#f7ecdc;--mut:#b9a68c;--bd:#4a3820}}
:root[data-theme="dark"]{--bg:#1a140c;--card:#261d12;--tx:#f7ecdc;--mut:#b9a68c;--bd:#4a3820}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 10px}
.stage{border-radius:16px;overflow:hidden;border:1px solid var(--bd);background:#fdf3dc}
svg{display:block;width:100%;height:auto}
.cap{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600;min-height:3.4em}
.ctl{display:flex;gap:10px;align-items:center}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;background:#ff7a00;color:#fff;cursor:pointer}
input[type=range]{flex:1}
.tm{font-size:.85rem;color:var(--mut);min-width:70px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<h1>🎬 Simulasi Berbagi Printer di Lab Komputer</h1>
<div class="stage">
<svg id="sv" viewBox="0 0 800 450" font-family="system-ui,sans-serif" text-anchor="middle">
<rect width="800" height="450" fill="#fdf3dc"/>
<rect x="0" y="400" width="800" height="50" fill="#e8cf9c"/>
<text x="270" y="16" font-size="12" font-weight="700" fill="#7a5a2a">🏫 LAB KOMPUTER</text>
<g id="lines"></g>
<g id="lap"></g>
<circle cx="270" cy="235" r="30" fill="#12263a"/>
<text x="270" y="232" fill="#fff" font-size="12" font-weight="700">Jaringan</text>
<text x="270" y="246" fill="#9fd0ff" font-size="11">(LAN)</text>
<line x1="300" y1="235" x2="560" y2="140" stroke="#2b7fff" stroke-width="3" stroke-dasharray="6 4"/>
<g id="pk"></g>
<!-- queue -->
<rect x="560" y="20" width="220" height="250" rx="12" fill="#fff" stroke="#ff9d2e" stroke-width="2"/>
<text x="670" y="42" font-size="13" font-weight="700" fill="#b45a00">📋 Antrean Cetak (Spooler)</text>
<g id="rows"></g>
<!-- printer -->
<g id="pg"><rect id="page" x="640" y="335" width="60" height="40" fill="#fff" stroke="#999"/><rect id="pgc" x="640" y="335" width="60" height="8" fill="#000"/></g>
<rect x="580" y="285" width="180" height="95" rx="14" fill="#5b6b7c"/>
<rect x="600" y="298" width="140" height="14" rx="4" fill="#2f3b48"/>
<text x="670" y="338" fill="#fff" font-size="26">🖨️</text>
<text id="pst" x="670" y="362" fill="#fff" font-size="12" font-weight="700"></text>
<g id="done"></g>
<text id="cnt" x="670" y="440" font-size="12" font-weight="700" fill="#7a5a2a"></text>
</svg>
</div>
<div class="cap" id="cap"></div>
<div class="ctl">
  <button id="pp">⏸</button>
  <button id="rs">↺</button>
  <button id="muteBtn" title="Bisukan / Nyalakan Suara">🔊</button>
  <input type="range" id="sc" min="0" max="5150" value="0">
  <span class="tm" id="tm"></span>
</div>
<audio id="aud" src="/suara/video2.mp4" preload="auto"></audio>
</div>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const aud=$('aud');
let T=51.5;
aud.onloadedmetadata=()=>{if(aud.duration&&!isNaN(aud.duration)){T=aud.duration;$('sc').max=Math.round(T*100)}};

const el=(tag,a,p,txt)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e};
const N=10,col=i=>`hsl(${i*36},70%,50%)`;
const ts=i=>7.5+i*0.7, arr=i=>ts(i)+1.2, ps=i=>24.5+i*1.85, pe=i=>ps(i)+1.6;
const S=[[0,'Di lab komputer ada 10 laptop, tetapi hanya 1 printer. Bagaimana agar semuanya bisa mencetak?'],
[7.5,'Kesepuluh mahasiswa menekan tombol Cetak. Perintah dikirim lewat jaringan ke printer.'],
[16,'Sistem operasi menaruh semua pekerjaan ke antrean cetak (spooler), jadi tidak saling tabrakan.'],
[24.5,'Printer mengerjakan satu per satu sesuai urutan. Tidak ada yang menyerobot atau merusak cetakan orang lain.'],
[44.5,'Semua tercetak dengan tertib. Itulah Resource Sharing: banyak pengguna berbagi satu perangkat secara adil.']];
const L=[],R=[],K=[],D=[];
const pos=i=>({x:70+(i%5)*100,y:i<5?70:150});
for(let i=0;i<N;i++){const {x,y}=pos(i);
 el('line',{x1:x,y1:y+24,x2:270,y2:235,stroke:'#c9b48a','stroke-width':1.5},$('lines'));
 const g=el('g',{},$('lap'));
 el('rect',{x:x-32,y:y-22,width:64,height:40,rx:4,fill:col(i)},g);
 el('rect',{x:x-40,y:y+18,width:80,height:6,rx:3,fill:'#98a5b3'},g);
 el('text',{x:x,y:y+40,'font-size':11,fill:'#5a4020','font-weight':700},g,'Mhs '+(i+1));
 L.push(el('text',{x:x,y:y+2,'font-size':20},g,''));
 const r=el('g',{},$('rows'));
 el('rect',{x:568,y:0,width:204,height:20,rx:4,fill:col(i)},r);
 R.push({g:r,t:el('text',{x:670,y:14,'font-size':11,fill:'#fff','font-weight':700},r,'')});
 K.push(el('circle',{r:7,fill:col(i),stroke:'#fff','stroke-width':2,opacity:0},$('pk')));
 D.push(el('rect',{x:590+i*16,y:415,width:12,height:16,rx:2,fill:col(i),opacity:0},$('done')));
}
const lerp=(a,b,p)=>a+(b-a)*p;
function render(t){
 let si=0;S.forEach((s,i)=>{if(t>=s[0])si=i});$('cap').textContent=S[si][1];
 let doneN=0,rank=0,cur=-1;
 for(let i=0;i<N;i++){const {x,y}=pos(i),p=t-ts(i);
  // laptop status
  L[i].textContent=t<ts(i)?'':p<0.6?'📤':t<pe(i)?'⏳':'✅';
  if(t>=pe(i))doneN++;
  // packet
  const k=K[i];
  if(p>=0&&p<1.2){let X,Y;if(p<0.6){X=lerp(x,270,p/0.6);Y=lerp(y+24,235,p/0.6)}else{const q=(p-0.6)/0.6;X=lerp(270,560,q);Y=lerp(235,140,q)}
   k.setAttribute('cx',X);k.setAttribute('cy',Y);k.setAttribute('opacity',1)}else k.setAttribute('opacity',0);
  // queue row
  const inQ=t>=arr(i)&&t<pe(i),r=R[i];
  if(inQ){const isCur=t>=ps(i);if(isCur)cur=i;
   r.g.setAttribute('transform',`translate(0,${54+rank*20})`);r.g.setAttribute('opacity',1);
   r.t.textContent=isCur?`🖨 Mhs ${i+1} — sedang dicetak`:`Mhs ${i+1} — menunggu (#${rank+1})`;rank++}
  else r.g.setAttribute('opacity',0);
  D[i].setAttribute('opacity',t>=pe(i)?1:0);
 }
 // page animation
 if(cur>=0){const q=(t-ps(cur))/1.6;$('page').setAttribute('y',335+q*70);$('pgc').setAttribute('y',335+q*70);$('pgc').setAttribute('fill',col(cur));$('pg').setAttribute('opacity',1)}else $('pg').setAttribute('opacity',0);
 $('pst').textContent=cur>=0?`Mencetak: Mhs ${cur+1}`:(t<24.5?'Siaga':'Selesai');
 $('cnt').textContent=`✅ ${doneN}/${N} tercetak`;
 $('sc').value=Math.round(t*100);$('tm').textContent=t.toFixed(0)+' / '+T.toFixed(0)+' dtk';
}
let t=0,run=true,last=performance.now();
function frame(now){
 const dt=(now-last)/1000;last=now;
 if(run){
  if(!aud.paused&&aud.currentTime>0){t=aud.currentTime}else{t+=dt}
  if(t>=T){t=T;run=false;$('pp').textContent='▶';aud.pause()}
 }
 render(t);
 requestAnimationFrame(frame);
}
$('pp').onclick=()=>{
 if(t>=T){t=0;try{aud.currentTime=0}catch(e){}}
 run=!run;$('pp').textContent=run?'⏸':'▶';
 if(run){aud.play().catch(()=>{})}else{aud.pause()}
};
$('rs').onclick=()=>{t=0;try{aud.currentTime=0}catch(e){};run=true;$('pp').textContent='⏸';aud.play().catch(()=>{})};
$('muteBtn').onclick=()=>{aud.muted=!aud.muted;$('muteBtn').textContent=aud.muted?'🔇':'🔊'};
$('sc').oninput=e=>{t=e.target.value/100;try{aud.currentTime=Math.min(t,aud.duration||t)}catch(e){};render(t)};
document.addEventListener('click',()=>{if(run&&aud.paused){try{aud.currentTime=t}catch(e){};aud.play().catch(()=>{})}},{once:true});
aud.play().catch(()=>{});
requestAnimationFrame(frame);
</script>
</body>
</html>
