<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Simulasi Multitasking</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef7ff;--card:#fff;--tx:#12263a;--mut:#5b6b7c;--bd:#cfe6f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1722;--card:#15232f;--tx:#e8f1f8;--mut:#93a5b6;--bd:#26394a}}
:root[data-theme="dark"]{--bg:#0d1722;--card:#15232f;--tx:#e8f1f8;--mut:#93a5b6;--bd:#26394a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 10px}
.stage{border-radius:16px;overflow:hidden;border:1px solid var(--bd);background:#dfefff}
svg{display:block;width:100%;height:auto}
.cap{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600;min-height:3.4em}
.ctl{display:flex;gap:10px;align-items:center}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;background:#0a84d6;color:#fff;cursor:pointer}
input[type=range]{flex:1}
.tm{font-size:.85rem;color:var(--mut);min-width:64px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<h1>🎬 Simulasi Multitasking: Sehari Bersama Bayu</h1>
<div class="stage">
<svg viewBox="0 0 800 450" font-family="system-ui,sans-serif">
<rect width="800" height="450" fill="#dfefff"/>
<rect x="0" y="345" width="800" height="105" fill="#b7825a"/>
<!-- CPU panel -->
<g id="cpu" opacity="0">
<rect x="24" y="24" width="250" height="84" rx="12" fill="#12263a"/>
<text x="40" y="50" fill="#fff" font-size="15" font-weight="700">🧠 CPU (1 core)</text>
<text id="cpuT" x="40" y="72" fill="#9fd0ff" font-size="12"></text>
<g id="blocks"></g>
</g>
<!-- student -->
<g id="stu">
<rect x="180" y="240" width="90" height="110" rx="18" fill="#3b6fd8"/>
<line id="arm" x1="262" y1="285" x2="360" y2="318" stroke="#f2c7a0" stroke-width="14" stroke-linecap="round"/>
<g id="head">
<circle cx="225" cy="200" r="34" fill="#f2c7a0"/>
<path d="M191 197a34 34 0 0 1 68 0c-12-14-46-14-68 0z" fill="#2b2118"/>
<circle cx="238" cy="203" r="3" fill="#2b2118"/>
<path d="M232 217q8 6 16 0" stroke="#2b2118" fill="none" stroke-width="2"/>
<g id="hp" opacity="0"><path d="M188 200a37 37 0 0 1 74 0" stroke="#222" stroke-width="6" fill="none"/><rect x="182" y="196" width="12" height="24" rx="5" fill="#1db954"/><rect x="256" y="196" width="12" height="24" rx="5" fill="#1db954"/></g>
</g>
<text x="205" y="335" font-size="13" fill="#fff" font-weight="700">Bayu</text>
</g>
<g id="notes" fill="#1db954" font-size="26"><text id="n0">♪</text><text id="n1">♫</text><text id="n2">♪</text></g>
<!-- laptop -->
<rect x="360" y="120" width="400" height="220" rx="10" fill="#1f2a37"/>
<rect x="370" y="130" width="380" height="200" fill="#f4f8fc"/>
<rect x="335" y="340" width="450" height="14" rx="6" fill="#98a5b3"/>
<!-- Word -->
<g id="wW"><rect id="wR" x="380" y="140" width="210" height="180" fill="#fff" stroke="#2b7fff" stroke-width="2"/><rect x="380" y="140" width="210" height="20" fill="#2b7fff"/><text x="388" y="155" fill="#fff" font-size="12" font-weight="700">📝 Word</text><text id="wT" font-size="11" fill="#222"></text></g>
<!-- Spotify -->
<g id="sW"><rect id="sR" x="600" y="140" width="140" height="86" fill="#121212" stroke="#1db954" stroke-width="2"/><text x="608" y="158" fill="#1db954" font-size="12" font-weight="700">🎵 Spotify</text><g id="eq" fill="#1db954"></g><rect x="610" y="212" width="120" height="4" fill="#444"/><rect id="sP" x="610" y="212" width="0" height="4" fill="#1db954"/></g>
<!-- Browser -->
<g id="bW"><rect id="bR" x="600" y="234" width="140" height="86" fill="#fff" stroke="#ff8a3d" stroke-width="2"/><rect x="600" y="234" width="140" height="20" fill="#ff8a3d"/><text x="608" y="249" fill="#fff" font-size="12" font-weight="700">🌐 Browser</text><text x="610" y="278" font-size="11" fill="#222">⬇ tugas_referensi.pdf</text><rect x="610" y="290" width="120" height="8" rx="4" fill="#ddd"/><rect id="bP" x="610" y="290" width="0" height="8" rx="4" fill="#ff8a3d"/><text id="bT" x="610" y="312" font-size="11" fill="#222"></text></g>
</svg>
</div>
<div class="cap" id="cap"></div>
<div class="ctl">
  <button id="pp">⏸</button>
  <button id="rs">↺</button>
  <button id="muteBtn" title="Bisukan / Nyalakan Suara">🔊</button>
  <input type="range" id="sc" min="0" max="3220" value="0">
  <span class="tm" id="tm"></span>
</div>
<audio id="aud" src="/suara/video1.mp4" preload="auto"></audio>
</div>
<script>
const $=id=>document.getElementById(id);
const aud=$('aud');
let T=32.2;
aud.onloadedmetadata=()=>{if(aud.duration&&!isNaN(aud.duration)){T=aud.duration;$('sc').max=Math.round(T*100)}};

const S=[[0,'Kenalkan Bayu, mahasiswa yang punya tiga urusan sekaligus: tugas di Word, musik di Spotify, dan unduhan di browser.'],
[4,'Pertama, Bayu mengetik tugas di Word.'],
[8,'Sambil itu, ia memasang headphone dan mendengarkan musik di Spotify.'],
[12,'Lalu ia mengunduh file referensi di browser. Semua terlihat jalan bersamaan!'],
[18,'Di balik layar: CPU hanya menjalankan 1 proses per irisan waktu, lalu berpindah super cepat (time slicing).'],
[26,'Karena perpindahannya sangat cepat, kita merasa semuanya berjalan bersamaan. Itulah Concurrency!']];
const text='Tugas Sistem Operasi: Concurrency adalah kemampuan OS menjalankan banyak proses secara bersamaan atau dalam irisan waktu yang sangat cepat.';
const col=['#2b7fff','#1db954','#ff8a3d'],nm=['Word','Spotify','Browser'];
const eq=$('eq');for(let i=0;i<8;i++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',610+i*14);r.setAttribute('width',9);eq.appendChild(r)}
const bl=$('blocks');for(let i=0;i<14;i++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',40+i*17);r.setAttribute('y',82);r.setAttribute('width',14);r.setAttribute('height',14);r.setAttribute('rx',3);bl.appendChild(r)}
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function hl(id,on,started,c){const r=$(id);r.setAttribute('stroke-width',on?5:2);r.parentNode.setAttribute('opacity',started?(on?1:.75):.25)}
function render(t){
 let si=0;S.forEach((s,i)=>{if(t>=s[0])si=i});$('cap').textContent=S[si][1];
 const wOn=t>=4,sOn=t>=8,bOn=t>=12,slice=t>=18&&t<26,n=Math.floor(t*8);
 let act=-1;
 if(slice)act=n%3;else if(t>=26)act=-1;else act=t<8?(t>=4?0:-1):t<12?1:2;
 if(t>=4&&t<8)act=0;
 hl('wR',act===0||t>=26,wOn);hl('sR',act===1||t>=26,sOn);hl('bR',act===2||t>=26,bOn);
 // word text
 const ch=wOn?Math.min(text.length,Math.floor((t-4)*7)):0,str=text.slice(0,ch),w=$('wT');
 w.innerHTML='';for(let i=0;i<str.length;i+=26){const ts=document.createElementNS('http://www.w3.org/2000/svg','tspan');ts.setAttribute('x',390);ts.setAttribute('dy',i?15:0);ts.textContent=str.slice(i,i+26);w.appendChild(ts)}
 w.setAttribute('y',182);
 // spotify
 $('hp').setAttribute('opacity',sOn?1:0);
 [...eq.children].forEach((r,i)=>{const h=sOn?6+Math.abs(Math.sin(t*6+i*1.3))*28:4;r.setAttribute('height',h);r.setAttribute('y',204-h)});
 $('sP').setAttribute('width',sOn?Math.min(120,(t-8)*5):0);
 for(let i=0;i<3;i++){const p=((t*0.5+i/3)%1),e=$('n'+i);e.setAttribute('x',215+i*22+Math.sin(p*6)*10);e.setAttribute('y',150-p*90);e.setAttribute('opacity',sOn?1-p:0)}
 // browser
 const d=bOn?cl((t-12)/16*100,0,100):0;$('bP').setAttribute('width',d*1.2);$('bT').textContent=bOn?Math.floor(d)+'% selesai':'';
 // student
 const dy=wOn?Math.sin(t*22)*4:0;$('arm').setAttribute('y2',318+dy);
 $('head').setAttribute('transform',sOn?`rotate(${Math.sin(t*5)*4} 225 240)`:'');
 // cpu
 $('cpu').setAttribute('opacity',t>=18?1:0);
 if(t>=18){$('cpuT').textContent=slice?'Irisan #'+n+' → '+nm[act]:'Bergantian sangat cepat';
  [...bl.children].forEach((r,j)=>r.setAttribute('fill',col[((n-13+j)%3+3)%3]))}
 $('sc').value=Math.round(t*100);$('tm').textContent=t.toFixed(0)+' / '+T.toFixed(0)+' dtk';
}
let t=0,run=true,last=performance.now();
function frame(now){
 const dt=(now-last)/1000;last=now;
 if(run){
  if(!aud.paused&&aud.currentTime>0){t=aud.currentTime}else{t+=dt}
  if(t>=T){t=T;run=false;$('pp').textContent='▶';aud.pause()}
 }
 render(t);
 requestAnimationFrame(frame);
}
$('pp').onclick=()=>{
 if(t>=T){t=0;try{aud.currentTime=0}catch(e){}}
 run=!run;$('pp').textContent=run?'⏸':'▶';
 if(run){aud.play().catch(()=>{})}else{aud.pause()}
};
$('rs').onclick=()=>{t=0;try{aud.currentTime=0}catch(e){};run=true;$('pp').textContent='⏸';aud.play().catch(()=>{})};
$('muteBtn').onclick=()=>{aud.muted=!aud.muted;$('muteBtn').textContent=aud.muted?'🔇':'🔊'};
$('sc').oninput=e=>{t=e.target.value/100;try{aud.currentTime=Math.min(t,aud.duration||t)}catch(e){};render(t)};
document.addEventListener('click',()=>{if(run&&aud.paused){try{aud.currentTime=t}catch(e){};aud.play().catch(()=>{})}},{once:true});
aud.play().catch(()=>{});
requestAnimationFrame(frame);
</script>
</body>
</html>
